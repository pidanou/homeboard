services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyboard
      POSTGRES_USER: familyboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/pidanou/homeboard-backend:latest
    restart: unless-stopped
    env_file:
      - back.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://familyboard:${POSTGRES_PASSWORD}@db:5432/familyboard?sslmode=disable
      UPLOAD_DIR: /app/uploads
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  web:
    image: ghcr.io/pidanou/homeboard-web:latest
    # To self-build instead of pulling from GHCR, comment out `image:` above and uncomment, keep only 1 dockerfile line:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile          # runtime-configurable Node image
    #   dockerfile: Dockerfile.static   # lightweight nginx image; API URL baked in at build time
    #   args:
    #     BASE_PATH: ${BASE_PATH:-}     # Dockerfile / Dockerfile.static
    #     VITE_API_URL: ${VITE_API_URL} # Dockerfile.static only
    restart: unless-stopped
    env_file:
      - front.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads_data:
